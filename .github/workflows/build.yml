name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # để tạo/cập nhật Release "nightly"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Runner đã có sẵn Android SDK; chỉ cần chấp nhận license để AGP tự tải NDK/CMake.
      - name: Accept Android licenses
        run: yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Không cần gradle-wrapper.jar: action tự cài Gradle 8.9
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch prebuilt Samsung NPU libs (if any)
        run: |
          if git fetch -q origin prebuilt-npu 2>/dev/null; then
            mkdir -p core-enn/src/main/jniLibs/arm64-v8a
            git archive FETCH_HEAD prebuilt | tar -x -C /tmp
            cp /tmp/prebuilt/arm64-v8a/libLiteRtDispatch_Samsung.so core-enn/src/main/jniLibs/arm64-v8a/
            # libLiteRt.so dựng từ cùng tag v2.3.2: có export abseil mà bản Maven ẩn đi (dispatch cần).
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp /tmp/prebuilt/extra/libLiteRt.so app/src/main/jniLibs/arm64-v8a/
            ls -la core-enn/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/arm64-v8a
          fi

      - name: Fetch AOT-compiled NPU models (if any)
        run: |
          if git fetch -q origin prebuilt-models 2>/dev/null; then
            mkdir -p app/src/main/assets/models
            git archive FETCH_HEAD models | tar -x -C /tmp
            # Chỉ mang model app thật sự dùng: flow INT8 3 mức + SR x2/x1 đã huấn luyện.
            for f in flow_192_int8 flow_640_int8 flow_1280_int8 sr_x2_1170x540 sr_x1_1536x704; do
              [ -f /tmp/models/$f.tflite ] && cp /tmp/models/$f.tflite app/src/main/assets/models/ || echo "::warning title=model::thiếu $f.tflite"
            done
            find app/src/main/assets/models -name '*.tflite' -size -2k -delete   # bỏ file rỗng (AOT một phần)
            ls -la app/src/main/assets/models
          fi

      - name: Build debug APK
        run: |
          set +e
          gradle :app:assembleDebug --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            # Đưa lỗi lên annotation để đọc được mà không cần tải log.
            msg=$(grep -E "^e: |error:|warning: .*unresolved|FAILED|What went wrong|Execution failed|Caused by|> .*(not found|No such|Could not|Failed)" build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build failed::${msg}"
          fi
          exit $code

      - uses: actions/upload-artifact@v4
        with:
          name: fluidframes-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # Release "nightly": luôn là APK mới nhất của feat/initial-import, link tải cố định.
      - name: Publish nightly release
        if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/bisect-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          cp "$apk" XclipseENN-SS.apk
          short=$(git rev-parse --short HEAD)
          msg=$(git log -1 --pretty=%s)
          gh release delete test-609e627 -y --cleanup-tag 2>/dev/null || true
          gh release create test-609e627 XclipseENN-SS.apk --prerelease --target "$GITHUB_SHA" \
            --title "Bản so lỗi phóng to ($short)" \
            --notes "Build #${GITHUB_RUN_NUMBER} · commit $short: $msg"
